<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <script>
    // Old Trace links (kids.sauravsood.com/#history, /#d/12, /#lion …) lived
    // at the root before Trace moved to /trace/. The hub has no hash routes of
    // its own, so any hash here belongs to Trace. Runs before anything else.
    function toTrace() { if (location.hash.length > 1) location.replace("/trace/" + location.hash); }
    toTrace();
    addEventListener("hashchange", toTrace);
  </script>
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Kids</title>
  <meta name="description" content="Things to make and explore: tracing, the night sky and dinosaurs in 3D.">
  <meta name="theme-color" content="#fff7ec">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Kids">
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/trace/icons/apple-touch-icon.png">
  <link rel="stylesheet" href="/shared/kids.css">
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K71K5101R8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-K71K5101R8');
  </script>
</head>
<body>
  <main class="page">
    <ul id="tiles" class="tiles" aria-label="Things to do"></ul>
  </main>
  <script type="module">
    import { TILES } from "/tiles.js";
    const esc = (s) => s.replace(/[&<>"]/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" })[c]);
    document.getElementById("tiles").innerHTML = TILES.map((t) => `
      <li><a class="tile" href="${esc(t.href)}" style="--tint:${esc(t.tint)}">
        <div class="art">${t.art}</div>
        <div class="words"><h2>${esc(t.name)}</h2><p>${esc(t.line)}</p></div>
      </a></li>`).join("");
  </script>
</body>
</html>
