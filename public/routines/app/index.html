<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>My Routines</title>
  <meta name="theme-color" content="#fff7ec">
  <link rel="icon" href="/shared/icon.svg" type="image/svg+xml">
  <link rel="stylesheet" href="/shared/kids.css">
  <link rel="stylesheet" href="routines.css">
  <script src="/shared/grownup.js" defer></script>
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-K71K5101R8"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    // Ad signals are off: this site is for kids.
    gtag('config', 'G-K71K5101R8', { allow_google_signals: false, allow_ad_personalization_signals: false });
  </script>
</head>
<body>
  <main class="page">
    <header class="bar">
      <a class="round" href="/" aria-label="Home">
        <svg viewBox="0 0 24 24"><path d="M3.5 11.5 L12 4 L20.5 11.5 M6 9.5 V20 H10 V14.5 H14 V20 H18 V9.5"/></svg>
      </a>
      <h1 id="title">My Routines</h1>
      <span class="spacer"></span>
      <button class="pillbtn" id="grownup">Grown-ups</button>
    </header>

    <div class="tabs" role="tablist">
      <button role="tab" id="tab-today" aria-selected="true">Today</button>
      <button role="tab" id="tab-week" aria-selected="false">This week</button>
    </div>

    <p class="cheer" id="cheer" aria-live="polite"></p>
    <section class="cards" id="today"></section>
    <section class="week" id="week" hidden></section>
  </main>

  <dialog class="sheet" id="setup-sheet">
    <form method="dialog">
      <h2>Pick the routines</h2>
      <p class="hint">Tap to add or remove. A few is plenty.</p>
      <div class="picks" id="setup-picks"></div>
      <div class="row end"><button class="pillbtn dark" value="close">Done</button></div>
    </form>
  </dialog>

  <script type="module" src="routines.js"></script>
</body>
</html>
